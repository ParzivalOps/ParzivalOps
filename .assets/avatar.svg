<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes gold-pulse {
        0% { filter: drop-shadow(0 0 5px #FFD700) brightness(1); }
        50% { filter: drop-shadow(0 0 20px #FFD700) brightness(1.15); }
        100% { filter: drop-shadow(0 0 5px #FFD700) brightness(1); }
      }
      .gold-glow {
        animation: gold-pulse 3s infinite ease-in-out;
      }
    </style>
  </defs>
  
  <!-- فایل PNG خودت را اینجا قرار می‌دهیم -->
  <!-- نکته: اگر فایل در همان پوشه .assets است، نام فایل را دقیقا اینجا بنویس -->
  <image href=".assets/avatar.png" width="180" height="180" x="10" y="10" class="gold-glow" />
</svg>
